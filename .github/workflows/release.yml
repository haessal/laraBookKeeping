name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, zip, bcmath, pdo_mysql, pcntl, sodium

      - name: Install phpDocumentor
        run: |
          curl -sS -L https://phpdoc.org/phpDocumentor.phar -o phpdoc.phar
          chmod +x phpdoc.phar
          sudo mv phpdoc.phar /usr/local/bin/phpdoc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: book-keeping
        run: npm install --legacy-peer-deps

      - name: Build assets
        working-directory: book-keeping
        run: npm run build

      - name: Generate code reference
        working-directory: book-keeping
        run: phpdoc -d ./app -t ./docs --ignore="vendor/*,node_modules/*,tests/*"

      - name: Create release archive
        run: |
          tar -czf laraBookKeeping-${{ github.ref_name }}.tar.gz \
            --exclude='book-keeping/.DS_Store' \
            --exclude='book-keeping/.env' \
            --exclude='book-keeping/.gitattributes' \
            --exclude='book-keeping/.gitignore' \
            --exclude='book-keeping/.phpdoc' \
            --exclude='book-keeping/.phpunit.result.cache' \
            --exclude='book-keeping/.phpunit.cache' \
            --exclude='book-keeping/.prettierignore' \
            --exclude='book-keeping/.prettierrc' \
            --exclude='book-keeping/node_modules' \
            --exclude='book-keeping/phpstan.neon' \
            --exclude='book-keeping/phpunit.xml' \
            --exclude='book-keeping/tests' \
            --exclude='book-keeping/vendor' \
            book-keeping/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: laraBookKeeping-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
