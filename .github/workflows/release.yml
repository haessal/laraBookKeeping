name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, zip, bcmath, pdo_mysql, pcntl, sodium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: book-keeping
        run: npm install --legacy-peer-deps

      - name: Build assets
        working-directory: book-keeping
        run: npm run build

      - name: Create release archive
        run: |
          tar -czf laraBookKeeping-${{ github.ref_name }}.tar.gz \
            --exclude='book-keeping/.git' \
            --exclude='book-keeping/.env' \
            --exclude='book-keeping/node_modules' \
            --exclude='book-keeping/vendor' \
            --exclude='book-keeping/tests' \
            --exclude='book-keeping/phpunit.xml' \
            book-keeping/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: laraBookKeeping-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
