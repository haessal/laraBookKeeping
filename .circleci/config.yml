version: 2.1

jobs:
  spellcheck:
    docker:
      - image: cimg/node:22.22.2
    steps:
      - checkout
      - run:
          name: Install CSpell
          command: npx --yes cspell --version
      - run:
          name: Run CSpell
          command: npx cspell --config .cSpell.json "**/*.{ts,tsx,php,md,yml,json}"

  formatcheck:
    docker:
      - image: cimg/node:22.22.2
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: |
            cd book-keeping
            npm install --legacy-peer-deps
      - run:
          name: Run prettier
          command: |
            cd book-keeping
            npx prettier --check "resources/views/**/*.blade.php" "resources/js/**/*.{js,jsx,ts,tsx}"
      - run:
          name: Run lint
          command: |
            cd book-keeping
            npm run lint

  build:
    docker:
      - image: cimg/node:22.22.2
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: |
            cd book-keeping
            npm install --legacy-peer-deps
      - run:
          name: Build assets
          command: |
            cd book-keeping
            npm run build

  static-analysis:
    docker:
      - image: cimg/php:8.5
    steps:
      - checkout
      - run:
          name: Install Composer dependencies
          command: |
            cd book-keeping
            composer install -n --prefer-dist
      - run:
          name: Run PHPStan with Larastan extension
          command: |
            cd book-keeping
            ./vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=512M

  phpunit:
    docker:
      - image: cimg/php:8.5-node
        environment:
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: default
          DB_PASSWORD: secret
      - image: cimg/mariadb:10.5
        environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MYSQL_USER: default
          MYSQL_PASSWORD: secret
    steps:
      - checkout
      - run:
          name: Install Xdebug 
          command: |
            sudo pecl channel-update pecl.php.net
            sudo pecl install xdebug
            sudo docker-php-ext-enable xdebug
      - run:
          name: Install Composer dependencies
          command: |
            cd book-keeping
            composer install -n --prefer-dist
      - run:
          name: Install npm dependencies and build assets
          command: |
            cd book-keeping
            npm install --legacy-peer-deps
            npm run build
      - run:
          name: Set up .env for testing
          command: |
            cd book-keeping
            cp .env.example .env
            php artisan key:generate
      - run:
          name: Wait for MySQL
          command: dockerize -wait tcp://127.0.0.1:3306 -timeout 60s
      - run:
          name: Run PHPUnit
          command: |
            cd book-keeping
            php artisan config:clear
            XDEBUG_MODE=coverage ./vendor/bin/phpunit -d memory_limit=512M \
              --coverage-clover ../build/logs/clover.xml
            php ./vendor/bin/php-coveralls \
              --coverage_clover=../build/logs/clover.xml \
              --json_path=../build/logs/coveralls-upload.json
workflows:
  ci:
    jobs:
      - spellcheck
      - formatcheck
      - build
      - static-analysis
      - phpunit
