<VirtualHost *:80>
    DocumentRoot /var/laraBookKeeping/book-keeping/public

    <Directory /var/laraBookKeeping/book-keeping/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    ErrorLog /var/log/httpd/error.log
    CustomLog /var/log/httpd/access.log combined
</VirtualHost>
